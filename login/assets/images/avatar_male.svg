  <rect x="52" y="42" width="11" height="9" rx="2.5" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="48" y1="46" x2="52" y2="46" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="37" y1="45" x2="33" y2="43" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="63" y1="45" x2="67" y2="43" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Eyes & Pupils -->

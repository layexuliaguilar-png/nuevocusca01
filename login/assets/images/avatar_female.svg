<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Coral / Warm Background -->
  <circle cx="50" cy="50" r="50" fill="#f87171"/>

  <!-- White Top -->
  <path d="M26,94 C30,76 40,70 50,70 C60,70 70,76 74,94 Z" fill="#ffffff"/>

  <!-- Neck -->
  <rect x="45" y="60" width="10" height="13" fill="#fed7aa"/>
  <path d="M43,69 Q50,75 57,69" fill="#fed7aa"/>

  <!-- Hair Back -->
  <path d="M24,52 C24,24 34,18 50,18 C66,18 76,24 76,52 C76,72 73,78 71,78 C68,52 66,35 50,35 C34,35 32,52 29,78 C27,78 24,72 24,52 Z" fill="#9a3412"/>

  <!-- Face Skin -->
  <ellipse cx="50" cy="48" rx="15" ry="18" fill="#fed7aa"/>

  <!-- Hair Bangs / Front Waves -->
  <path d="M33,36 C38,26 44,22 50,22 C59,22 67,28 67,39 C62,31 55,30 50,30 C40,30 35,33 33,36 Z" fill="#b45309"/>

  <!-- Eyebrows -->
  <path d="M40,42 Q43,40 46,42" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M54,42 Q57,40 60,42" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="43" cy="46" r="1.6" fill="#1e293b"/>
  <circle cx="57" cy="46" r="1.6" fill="#1e293b"/>

  <!-- Cheeks Blush -->
  <ellipse cx="38" cy="52" rx="3" ry="1.5" fill="#fca5a5" opacity="0.6"/>
  <ellipse cx="62" cy="52" rx="3" ry="1.5" fill="#fca5a5" opacity="0.6"/>

  <!-- Big Smile with White Teeth -->
  <path d="M44,56 Q50,63 56,56 Z" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
</svg>
